#:schema node_modules/wrangler/config-schema.json
# ============================================================================
#  Teleport — AI report publishing & expiring-share platform
#  Cloudflare Workers + D1 + Workers Assets
# ============================================================================
#  Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
#
#  Auth — on a HEADLESS machine (`wrangler login` will not work)
#    `wrangler login` runs an OAuth callback server on http://localhost:8976,
#    which a remote/headless box cannot receive. Use one of:
#
#      a) Device code flow (interactive, 5-minute window):
#           pnpm exec wrangler login --device --browser=false
#
#      b) API token (best for automation / no timing pressure):
#           Create at https://dash.cloudflare.com/profile/api-tokens with
#           permissions: Workers Scripts:Edit, D1:Edit, Workers Routes:Edit,
#           Account Settings:Read.
#             export CLOUDFLARE_API_TOKEN=...
#             export CLOUDFLARE_ACCOUNT_ID=...
#           (Wrangler reads both from the environment; no .env needed.)
#
#  Quick start
#    1. pnpm exec wrangler d1 create teleport-db-prod   # copy database_id
#    2. paste it into [[env.production.d1_databases]] below
#    3. pnpm exec wrangler d1 migrations apply DB --remote --env production
#    4. pnpm exec wrangler secret put AGENT_SECRET_KEY --env production   (x3)
#    5. pnpm run deploy
#    6. copy the printed URL into PUBLIC_BASE_URL, then re-deploy
#
#  Local development
#    cp .dev.vars.example .dev.vars   # then edit the secrets
#    pnpm run db:migrate:local && pnpm run dev
# ============================================================================

name = "teleport"
main = "src/index.ts"

# Pin the runtime contract. Bump deliberately, then re-run `npm run cf-typegen`.
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]

# Serve on <worker-name>.<subdomain>.workers.dev. Set false once a custom
# domain is attached via `routes` / `custom_domain`.
workers_dev = true

# ---------------------------------------------------------------------------
# Static assets (Workers Assets — replaces the legacy Pages deployment)
# ---------------------------------------------------------------------------
# `public/` holds the built dashboard SPA. The Worker stays in the request path
# for the paths listed in `run_worker_first`; everything else is served straight
# from the edge cache with no Worker invocation.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
#   /api/*  → REST API (never an asset)
#   /s/*    → public share pages: server-rendered so we can return a real
#             404/410 for unknown, revoked or expired tokens instead of
#             leaking a shell that then fails client-side.
#   /dashboard/* → falls through to the SPA assets (client-side auth check).
run_worker_first = ["/api/*", "/s/*"]

# ---------------------------------------------------------------------------
# D1 database binding (SQLite)
# ---------------------------------------------------------------------------
# Create it once:
#   npx wrangler d1 create teleport-db
# The command prints a database_id — paste it here. It is not a secret, but it
# is account-specific, so it is intentionally left as a placeholder.
[[d1_databases]]
binding = "DB"                       # -> env.DB in the Worker
database_name = "teleport-db"
database_id = "ad803822-04ba-4615-b27f-ae0d6d55bcd1"
migrations_dir = "migrations"        # `wrangler d1 migrations apply` reads here

# ---------------------------------------------------------------------------
# Non-secret environment variables
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
# Public origin used to build share URLs returned by the API. No trailing slash.
# This top-level value is for `wrangler dev` only; deploys use an env block.
PUBLIC_BASE_URL = "http://localhost:8787"
# Default lifetime (hours) when a caller omits `autoShareHours`. 0 = never expires.
DEFAULT_SHARE_HOURS = "168"
# Max accepted report body size in bytes (guards D1 row/CPU limits).
# See the CPU-time note in [env.production.vars] before raising this.
MAX_CONTENT_BYTES = "1048576"

# Secrets are NOT stored here. They are per-environment, so `--env` is required:
#   pnpm exec wrangler secret put AGENT_SECRET_KEY    --env production
#   pnpm exec wrangler secret put SESSION_SECRET      --env production
#   pnpm exec wrangler secret put ADMIN_PASSWORD_HASH --env production
# For local dev put the same names in .dev.vars (git-ignored).

# ---------------------------------------------------------------------------
# Staging
# ---------------------------------------------------------------------------
# Separate Worker name and D1 database so experiments never touch production
# data. Deploy with `pnpm run deploy:staging`.
[env.staging]
name = "teleport-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
PUBLIC_BASE_URL = "https://teleport-staging.<your-subdomain>.workers.dev"
DEFAULT_SHARE_HOURS = "168"
MAX_CONTENT_BYTES = "1048576"

# Staging gets its own D1 database so experiments never touch production data.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "teleport-db-staging"
database_id = "REPLACE_WITH_YOUR_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------
# READ BEFORE TOUCHING `workers_dev` OR `routes`.
#
# `workers_dev = false` turns off the free <name>.<subdomain>.workers.dev URL.
# That is ONLY safe when a custom domain / route is attached below. Otherwise
# the deployed Worker has no reachable entry point: `wrangler deploy` reports
# success and every request 404s.
#
# Default is `true` so the project works with zero domain setup and no ICP
# filing (免备案). Flip to false only after uncommenting a routes block.
[env.production]
name = "teleport"
workers_dev = true
# Preview URLs create a public <version>.<worker>.<subdomain>.workers.dev alias
# for every version. This app serves time-limited share links, so extra
# unauthenticated aliases are unwanted surface. Disable them.
preview_urls = false

[env.production.vars]
ENVIRONMENT = "production"
# MUST match the real deployed origin, otherwise every share URL returned by
# POST /api/reports and the dashboard points somewhere unreachable.
# First deploy: you will not know the subdomain yet. Deploy once, copy the
# printed URL here, then re-deploy.
PUBLIC_BASE_URL = "https://teleport.zeroicey-hp.workers.dev"
DEFAULT_SHARE_HOURS = "168"
# Ceiling for report size, in BYTES of the `content` field. Note CJK text is
# ~3 bytes per character, so 1 MiB is roughly 350k Chinese characters.
#
# This also bounds CPU: Markdown is rendered server-side on every share view.
# Measured on the production Worker, a 1016 KB ASCII report still rendered
# successfully (HTTP 200), so 1 MiB is safe here. If you ever raise this
# substantially, re-check for `error 1102` (exceededCpu) — the Workers Free
# plan nominally allows only 10 ms CPU per request, while Paid allows 30 s.
MAX_CONTENT_BYTES = "1048576"

[[env.production.d1_databases]]
# Binding name MUST stay `DB` — src/ reads `env.DB`. `wrangler d1 create`
# suggests a name derived from the database name; do not accept that here.
binding = "DB"
database_name = "teleport-db-prod"
database_id = "ad803822-04ba-4615-b27f-ae0d6d55bcd1"
migrations_dir = "migrations"

# To use a custom domain instead of workers.dev, uncomment BOTH lines below and
# set workers_dev = false above. `wrangler deploy` creates the DNS record and
# certificate automatically (the zone must already be on this account).
# [[env.production.routes]]
# pattern = "reports.<your-domain>.com"
# custom_domain = true

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1
